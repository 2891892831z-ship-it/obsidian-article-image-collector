name: Build and release
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run check
      - run: npm run build
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne $manifest.version) { throw 'Tag must match manifest version exactly' }
      - name: Package plugin
        shell: pwsh
        run: Compress-Archive -Path dist/main.js,dist/manifest.json,dist/scripts -DestinationPath article-image-collector.zip
      - uses: actions/upload-artifact@v4
        with:
          name: article-image-collector
          path: article-image-collector.zip
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: article-image-collector
      - uses: softprops/action-gh-release@v2
        with:
          files: article-image-collector.zip
          generate_release_notes: true
